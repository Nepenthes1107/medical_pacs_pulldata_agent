[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-pacs-pulldata-agent"
version = "0.1.0"
description = "Evidence-based PACS pull-data agent service"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "langgraph",
  "langgraph-checkpoint-redis",
  "langchain-core",
  "langchain-openai",
  "langsmith",
  "requests",
]

[project.optional-dependencies]
pacs = [
  "SQLAlchemy",
  "PyMySQL",
  "PyYAML",
  "redis",
  "pika",
  "pydicom",
  "pynetdicom",
]
rag = [
  "chromadb",
  "tiktoken",
  "langchain-text-splitters",
  "python-dotenv",
  "PyMuPDF",
  "python-docx",
  "beautifulsoup4",
  "bm25s",
  "jieba",
  "dashscope",
]
mcp = ["mcp"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
  "integration: 需要真实外部服务（docker compose 起的 Redis/MySQL/RabbitMQ/Orthanc 或本地 Chroma/BM25）",
  "redis: 需要真实 Redis 服务",
  "mysql: 需要真实 MySQL 服务",
  "rabbitmq: 需要真实 RabbitMQ 服务",
  "pacs: 需要真实 PACS/Orthanc DICOM 服务",
  "rag: 使用本地真实 Chroma/BM25 索引",
]

[tool.mypy]
python_version = "3.10"
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# 豁免非正确性规则：E501 超长多为中文文档/URL 且未跑 formatter；UP031 printf 为 py39 遗留
# 写法（量大、改写易引入行为差异）。F 与其余 UP（py310 类型现代化）仍全量强制。
ignore = ["E501", "UP031"]

[tool.ruff.lint.per-file-ignores]
# app/ 是 sys.modules 别名/星号再导出 facade（迁移期兼容契约），星号导入属设计内行为。
"app/**/*.py" = ["F403"]
