name: quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pacs,rag,mcp]" ruff mypy pytest
      - name: Lint
        run: ruff check src app tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test deps
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pacs,rag,mcp]" pytest
      - name: Start MySQL / Redis / RabbitMQ / Orthanc
        run: docker compose up -d mysql redis rabbitmq orthanc
      - name: Wait for service readiness
        run: |
          set -e
          # MySQL：容器内 mysqladmin 就绪后，还需 uii 用户可登录（镜像初始化完成）。
          for i in $(seq 1 90); do
            docker exec pulldata-mysql mysqladmin ping -h127.0.0.1 -uroot -proot --silent >/dev/null 2>&1 \
              && docker exec pulldata-mysql mysql -uuii -p011107 -h127.0.0.1 --execute "SELECT 1" >/dev/null 2>&1 \
              && break
            sleep 2
          done
          docker exec pulldata-mysql mysql -uuii -p011107 -h127.0.0.1 --execute "SELECT 1"
          # Redis / RabbitMQ / Orthanc：无固定容器名，轮询宿主映射端口。
          python - <<'PY'
          import socket, time
          for name, port in {"redis": 6379, "rabbitmq": 5672, "orthanc": 8042}.items():
              for _ in range(90):
                  try:
                      socket.create_connection(("127.0.0.1", port), timeout=1).close()
                      break
                  except OSError:
                      time.sleep(2)
              else:
                  raise SystemExit("service %s:%s not open" % (name, port))
              print(name, "ready")
          PY
      - name: Generate mock DICOM corpus and import into Orthanc
        run: |
          python scripts/generate_mock_dicom.py --output-dir data/dicom_mock
          python scripts/generate_mock_dicom.py \
            --study-uid 9.9.9.20260101000000.1 --num-series 2 \
            --instances-per-series 20 --output-dir data/dicom_mock
          python scripts/import_dicom_to_orthanc.py \
            --input-dir data/dicom_mock --orthanc-url http://localhost:8042
      - name: Integration tests (redis / mysql / rabbitmq / pacs / rag)
        run: python -m pytest tests/integration -m integration -q
